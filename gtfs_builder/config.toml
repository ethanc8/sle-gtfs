## Stations shared with Metro-North: stop_id and stop_code both use MNR's
## own stop_code (from gtfsmnr/stops.txt), not Amtrak's, even where Amtrak
## also serves the station (e.g. Stamford/New Haven/Bridgeport) -- this is
## so a future MNR-realtime-to-GTFS-RT converter can match stop_code
## directly against MNR's own codes without a separate translation table.
## Coordinates still prefer Amtrak where available (requirement: station
## locations come from the Amtrak feed) and fall back to MNR's own
## coordinates only for the 3 stations Amtrak doesn't serve.

[[stops]]
stop_id = "SLE-2SS"
stop_code = "2SS"
stop_name = "New Haven - State Street"
printed_names = ["New Haven State Street", "New Haven - State Street"]
stop_lat = 41.305252
