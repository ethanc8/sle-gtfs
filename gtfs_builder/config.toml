# CTrail Shore Line East GTFS -- everything that is *data* rather than
# PDF-parsing *logic*. See llm_notes/SPEC.md for the reasoning behind every
# non-obvious choice here. This file is meant to be hand-editable by a human
# or an LLM agent without touching gtfs_builder/*.py -- see SPEC.md section 9
# and UPDATING.md for the checklist to follow when a new timetable PDF
# arrives.
#
# Station coordinates below were copied once from sources/amtrak-gtfs-fixed/
# and sources/gtfsmnr/ (see each stop's `coordinate_source` comment) and are
# now hand-maintained here -- the build does NOT read those feeds at runtime.

[agency]
agency_id = "SLE"
agency_name = "CTrail Shore Line East"
agency_url = "https://shorelineeast.com"
agency_phone = "1-877-287-4337"
agency_timezone = "America/New_York"
agency_lang = "en"

[route]
route_id = "SLE"
route_short_name = "SLE"
route_long_name = "Shore Line East"
route_type = 2  # rail
route_color = "EA0D2A"
route_text_color = "FFFFFF"

[feed_info]
feed_publisher_name = "CTrail Shore Line East"
feed_publisher_url = "https://shorelineeast.com"
feed_lang = "en"
feed_start_date = "2026-03-29"
feed_end_date = "2026-11-01"
feed_version = "2026-10-05"

# One entry per station that appears in any timetable PDF. `printed_names`
# lists every exact spelling seen across the different tables (the "TO NEW
# HAVEN"/"TO NEW LONDON" tables and the "CONNECTIONS" tables spell the two
# New Haven stations slightly differently) -- matched case-sensitively after
# collapsing whitespace and dropping "-"/"." so small punctuation variations
# don't need their own entry. All SLE stations have step-free (level
# boarding) access, so wheelchair_boarding is always 1 -- see build_gtfs.py.
## Stations with no MNR service (SLE-only): stop_code is Amtrak's stop_id
## for that station (Amtrak's own stop_code column is blank for all of
## these, so its stop_id is the closest thing to an external code).

[[stops]]
stop_id = "SLE-NLC"
stop_code = "NLC"
stop_name = "New London"
printed_names = ["New London"]
stop_lat = 41.354267
stop_lon = -72.093224
coordinate_source = "amtrak-gtfs-fixed/stops.txt NLC"

[[stops]]
stop_id = "SLE-OSB"
stop_code = "OSB"
stop_name = "Old Saybrook"
printed_names = ["Old Saybrook"]
