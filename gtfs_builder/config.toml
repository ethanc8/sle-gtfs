# Station names that legitimately appear as row labels in the "CONNECTIONS
# TO/FROM NEW YORK" tables but are Metro-North-only stations (no SLE service)
# -- rows with one of these labels are silently skipped during extraction
# rather than treated as an unmapped-station error. A label that matches
# neither this list nor `stops` above is an extraction bug or a genuinely new
# station and should raise, not be silently dropped.
#
# NOTE: this table must stay ABOVE the [[stops]]/[[revision]] arrays-of-tables
# below -- in TOML, a bare `key = value` after an array-of-tables header
# attaches to the last entry of that array, not to the document root.
[extraction]
excluded_connection_stations = [
    "South Norwalk",
    "Greenwich",
    "Harlem 125th St",
    "Grand Central Terminal",
]

# Revisions actually included in the shipped feed (requirement coverage:
# 2026-03-29 through 2026-11-01). See SPEC.md section 9 for how "standing"
# vs. "exception" revisions differ and UPDATING.md for how to add a new one.
#
# type = "standing": ordinary day-of-week calendar.txt service over
#   [start_date, end_date].
# type = "exception": calendar_dates.txt-only service active on exactly
#   `dates`. Every trip under it gets its own trip_id/stop_times, entirely
#   separate from any standing-revision trip, and build_gtfs.py emits
#   exception_type=2 rows suppressing whichever standing service(s) would
#   otherwise run on those same dates -- see build_gtfs.py
#   `suppressed_services_for`.

[[revision]]
name = "20260329-weekday"
pdf = "SLE-3_29-MNR-Schedule-Change.pdf"
type = "standing"
day_type = "weekday"
start_date = "2026-03-29"
end_date = "2026-10-04"

[[revision]]
name = "20260329-weekend"
pdf = "SLE-3_29-MNR-Schedule-Change.pdf"
type = "standing"
day_type = "weekend"
start_date = "2026-03-29"
end_date = "2026-10-04"

[[revision]]
name = "20261005-weekday"
pdf = "SLE-October-5th-schedule_edit.pdf"
type = "standing"
day_type = "weekday"
start_date = "2026-10-05"
end_date = "2026-11-01"

[[revision]]
name = "20261005-weekend"
pdf = "SLE-October-5th-schedule_edit.pdf"
type = "standing"
day_type = "weekend"
start_date = "2026-10-05"
end_date = "2026-11-01"

[[revision]]
name = "20261010-11-outage"
pdf = "SLE-10_10-Portal-North-Bridge-MNR-WALK-Bridge-Outage-1.pdf"
type = "exception"
day_type = "weekend"
dates = ["2026-10-10", "2026-10-11"]
notes = """
Portal North Bridge / MNR Walk Bridge outage notice. Extraction confirms
SLE's own trip numbers and times are byte-identical to the standing
20261005-weekend revision -- only the MNR connection columns (out of scope,
requirement #8) differ. Still modeled as a full independent exception
service (own service_id, own trip_ids/stop_times, suppresses the standing
weekend service on these two dates) rather than skipped, per the project
owner: every exception PDF gets this treatment uniformly, whether or not
SLE's own schedule actually changed, so the pipeline doesn't need a special
"no-op" case and generalizes cleanly to a future outage that DOES change
SLE's own trips.
"""
